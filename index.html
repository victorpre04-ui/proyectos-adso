<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gas - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

    <main class="container">
        <form id="registroForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombres</label>
                    <input type="text" class="form-control" placeholder="Ingrese nombres">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Número de Cédula</label>
                    <input type="number" class="form-control" placeholder="000000000">
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Guardar Registro</button>
        </form>
    </main>

</body>
</html>
